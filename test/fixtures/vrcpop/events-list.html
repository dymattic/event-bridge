<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manage Events</title>
<meta name="csrf-token" content="TEST_CSRF_TOKEN">
</head>
<body>
<div class="manage-container">
  <section class="manage-section" data-section="events">
    <div class="events-section-head">
      <h2 class="manage-section-title">Upcoming Events <span class="events-count">1</span></h2>
    </div>
    <div class="event-list">
      <div class="event-card" data-filter-text="what's poppin">
        <div class="event-card-info">
          <h4>what's poppin</h4>
          <div class="event-card-meta">
            <span><span class="icon95 icon95-calendar" aria-hidden="true"></span> Thu, Sep 3, 2026 at 10:00 PM</span>
            <span><span class="icon95 icon95-cd" aria-hidden="true"></span> 1 sets</span>
          </div>
        </div>
        <div class="event-card-actions">
          <a href="/manage/club/grp_00000000-0000-4000-8000-000000000001/events/100001" class="btn btn-secondary">Edit</a>
          <button class="btn btn-danger" onclick="deleteEvent(100001)" title="Delete">Delete</button>
        </div>
      </div>
    </div>
  </section>

  <section class="manage-section drafts-section" data-section="drafts">
    <div class="drafts-bulk" id="drafts-bulk">
      <span id="drafts-bulk-count">0 selected</span>
      <button id="drafts-publish" disabled><span id="drafts-publish-label">Publish selected</span></button>
    </div>
    <div class="event-list">
      <div class="event-card event-card--draft" data-draft-id="100002">
        <input type="checkbox" class="draft-pick__box" value="100002">
        <div class="event-card-info">
          <h4>draft night</h4>
          <div class="event-card-meta">
            <span><span class="icon95 icon95-calendar" aria-hidden="true"></span> Fri, Sep 11, 2026 at 9:00 PM</span>
            <span><span class="icon95 icon95-cd" aria-hidden="true"></span> 2 sets</span>
          </div>
        </div>
        <div class="event-card-actions">
          <a href="/manage/club/grp_00000000-0000-4000-8000-000000000001/events/100002" class="btn btn-secondary">Edit</a>
        </div>
      </div>
    </div>
  </section>

  <section class="manage-section" data-section="history">
    <h2 class="manage-section-title">Past Events</h2>
    <div class="event-list event-list--faded">
      <div class="event-card">
        <div class="event-card-info">
          <h4>old night</h4>
          <div class="event-card-meta">
            <span><span class="icon95 icon95-calendar" aria-hidden="true"></span> Tue, Sep 1, 2026 at 8:30 PM</span>
            <span><span class="icon95 icon95-cd" aria-hidden="true"></span> 1 sets</span>
          </div>
        </div>
        <div class="event-card-actions">
          <a href="/manage/club/grp_00000000-0000-4000-8000-000000000001/events/100003" class="btn btn-secondary">View</a>
        </div>
      </div>
    </div>
  </section>
</div>
<script>
window.MANAGE_DATA = {
    groupId: "grp_00000000-0000-4000-8000-000000000001",
    groupName: "Example Club",
    bookedDates: {"2026-09-03":"what's poppin"},
    previewMode: false};
</script>
</body>
</html>
